# herdr-kit — the parts of a herdr setup that herdr leaves to you.
#
# herdr owns panes, agents and their lifecycle. What it has no opinion about is
# everything around that: telling nine identical panes apart, noticing that one
# of them is blocked while you are looking elsewhere, saving an arrangement you
# liked, and giving an agent a way to talk to its neighbours. This is that layer.
id = "dev.ariel.herdr-kit"
name = "herdr kit"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Per-pane colour, flash-and-sound alerts, layout save/restore, and session helpers."
platforms = ["macos", "linux"]

# Clones the palette pool and sprite packs into XDG cache. Kept out of the repo
# on purpose: 409 colour schemes and a megabyte of sprites are other people's
# assets, and a plugin that vendored them would be mostly not this plugin.
# Everything degrades to a no-op when they are absent, so a failed sync costs
# features rather than breaking the install.
[[build]]
command = ["sh", "scripts/sync-assets.sh"]

# The alert table is committed, so this matters only after someone edits
# packs.json — which is exactly when a stale table would quietly play the wrong
# clip. Swallows its own failure for the same reason the asset sync does: the
# committed table is still there when no interpreter is.
#
# uv first, for the reason __herdr_py gives in shell/herdr.sh: a shim earlier on
# PATH can answer a `python3` lookup and then refuse the call. This step ran bare
# python3 and, under such a shim, failed on every install — invisibly, because
# the `|| echo` below is doing its job and reports the same reassuring line
# whether the table was rebuilt or never touched.
[[build]]
command = ["sh", "-c", "if command -v uv >/dev/null 2>&1; then uv run --no-project python scripts/gen-alert-tables.py; else python3 scripts/gen-alert-tables.py; fi || echo 'alerts: kept the committed table'"]

# Doom's status-bar face frames, cut from id's own freely-redistributed v1.9
# shareware IWAD (never vendored — see fetch-doom-wad.py). Same degrade-quietly
# shape as the other build steps: no network or interpreter just means no face.
[[build]]
command = ["sh", "-c", "if command -v uv >/dev/null 2>&1; then uv run --no-project python scripts/fetch-doom-wad.py; else python3 scripts/fetch-doom-wad.py; fi || echo 'doomface: no frames cached, corner face stays off'"]

# Flash, sound and sprite on the two transitions worth interrupting someone for.
[[events]]
on = "pane.agent_status_changed"
command = ["zsh", "./alert-hook.sh"]

# Copy the name the human gave the session into herdr's agent name. Same event
# because there is no rename event to subscribe to — see name-hook.sh.
[[events]]
on = "pane.agent_status_changed"
command = ["zsh", "./name-hook.sh"]

# Keep each pane's label saying what it is and what it is doing. Third
# subscriber to this event, and the order between the three does not matter:
# they write different fields (a graphics overlay, the agent name, the label)
# and none reads what another wrote.
[[events]]
on = "pane.agent_status_changed"
command = ["zsh", "./title-hook.sh"]

# Start (if not already running) a background loop that keeps a Doom face
# drawn in that Claude pane's corner, reflecting its own context-window usage.
# Fourth subscriber to the same event, for the same reason as the other three:
# no separate "pane appeared" event exists, so the first status change a pane
# ever reports is what triggers the one-time spawn.
[[events]]
on = "pane.agent_status_changed"
command = ["zsh", "./doomface-hook.sh"]

[[actions]]
id = "names"
title = "Sync agent names from sessions"
command = ["sh", "./bin/herdr-agent-name", "--all"]

[[actions]]
id = "themes"
title = "Rebuild pane palettes"
command = ["zsh", "-c", "source ./shell/herdr.sh && herdr-themes-build"]

[[actions]]
id = "colorize"
title = "Repaint panes at a prompt"
command = ["zsh", "-c", "source ./shell/herdr.sh && herdr-colorize"]

[[actions]]
id = "alerts"
title = "List the named alerts"
command = ["zsh", "./alert-hook.sh", "--list"]

[[actions]]
id = "doomface-stop-all"
title = "Stop all doom faces"
command = ["zsh", "./doomface-hook.sh", "--stop-all"]

# A real tiled pane, not the corner overlay: split/tab/zoomed plugin panes
# "are normal Herdr panes after they open" (Herdr's own plugins.mdx), unlike
# `popup` (session-modal, steals all input) or the default `overlay`
# (transient, closes itself). This is the one that stays put as a widget.
[[panes]]
id = "doomface-widget"
title = "Doom Face"
platforms = ["macos", "linux"]
placement = "split"
command = ["sh", "-c", "if command -v uv >/dev/null 2>&1; then exec uv run --no-project python ./bin/herdr-doomface-widget; else exec python3 ./bin/herdr-doomface-widget; fi"]

[[actions]]
id = "doomface-widget"
title = "Open Doom face widget"
command = ["zsh", "./doomface-widget-action.sh"]

# herdr-sidebar ships its toggle as an action with no `contexts`, so herdr has
# nowhere to draw it and the sidebar is reachable only by CLI or a keybinding.
# Proxying it from here is what survives: the sidebar's own manifest lives in a
# GitHub-managed checkout that `plugin install` replaces wholesale.
[[actions]]
id = "sidebar"
title = "Toggle file sidebar"
contexts = ["pane", "workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin action invoke herdr-sidebar.open-sidebar"]
