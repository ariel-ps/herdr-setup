onboarding = false

[terminal]
# The installer resolves this executable on the target machine.
default_shell = "@SHELL@"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "terminal"

# The Alerts plugin handles paired flash/sound alerts.
[experimental]
kitty_graphics = true

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "Control panel: tools, plugins, sounds and help"
